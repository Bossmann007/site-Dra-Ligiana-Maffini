# Static Astro site on Cloudflare Workers Assets.
# Do not add @astrojs/cloudflare — output is already HTML in dist/.
# html_handling only issues 307s. worker/trailing-slash.ts runs first and
# answers non-canonical HTML URLs with one 308, preserving the query string.
name = "sitelili"
compatibility_date = "2026-09-17"
main = "worker/trailing-slash.ts"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "404-page"
html_handling = "force-trailing-slash"
run_worker_first = [
  "/*",
  "!/_astro/*",
  "!/brand/*",
  "!/logo/*",
  "!/fonts/*",
  "!/favicon.ico",
  "!/favicon.png",
  "!/favicon.svg",
  "!/favicon-source.png",
  "!/og.jpg",
  "!/theme-init.js",
  "!/robots.txt",
  "!/llms.txt",
  "!/*.xml",
]
